<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozpad na pixely</title>
<meta name="description" content="Pixel disintegration: turn photos into particles, make loops and monthly recap videos. Runs fully in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Oswald:wght@200..700&family=Playfair+Display:wght@400..900&family=Bebas+Neue&family=Anton&family=Pacifico&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#e9e7e1;--panel:#f6f5f1;--ink:#1c1e20;--mute:#686b70;--line:#cbc8bf;--acc:#e4572e;--stage:#d9d6cd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151719;--panel:#1e2124;--ink:#ecebe6;--mute:#9a9da2;--line:#33373b;--acc:#ff7a4d;--stage:#0f1113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151719;--panel:#1e2124;--ink:#ecebe6;--mute:#9a9da2;--line:#33373b;--acc:#ff7a4d;--stage:#0f1113;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:1fr 320px;align-items:start}}
h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 12px;font-size:.9rem}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;min-height:260px;overflow:hidden;position:relative}
canvas{max-width:100%;max-height:72vh;height:auto;display:block}
.drop{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);font-weight:600}
.stage.over .drop{display:grid}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem}
label span{display:flex;justify-content:space-between}
label output{color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;padding:10px 14px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
button.main,.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn input{display:none}
button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button:disabled{opacity:.5;cursor:default}
.sub#msg{margin:0;min-height:1.4em}
.row>*{flex:1}
input[type=text],select{font:inherit;padding:10px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
</style>
</head>
<body>
<main>
<section>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>Rozpad na pixely</h1><button id="lang" aria-label="Language" style="min-height:36px;padding:6px 12px;flex:none">EN</button></div>
<p class="sub">Nahraj až 30 fotiek (napr. na mesačný recap), nastav efekt a ulož video.</p>
<div class="stage" id="stage"><canvas id="cv" width="800" height="520"></canvas><div class="drop">Pusti fotku sem</div></div>
</section>
<section class="panel">
<div class="row">
<label class="btn" tabindex="0" id="up">Nahrať fotky<input type="file" id="file" accept="image/*" multiple></label>
</div>
<p class="sub" style="margin:0">Presety</p><div id="pres" class="row"></div>
<p class="sub" style="margin:0">Formát</p><div id="fmts" class="row"></div>
<p class="sub" style="margin:0">Smer rozpadu</p><div id="dirs" class="row"></div>
<p class="sub" style="margin:0">Tvar častíc</p><div id="shapes" class="row" role="group" aria-label="Tvar častíc"></div>
<div id="ctl" style="display:grid;gap:12px"></div>
<label>Pozadie videa<input type="color" id="bg" value="#111315" style="width:100%;height:40px"></label>
<label>Text na prvej fotke<input type="text" id="ttl" maxlength="60" placeholder="napr. Október 2026"></label>
<label>Font<select id="fnt">
<option value="'Montserrat',sans-serif">Montserrat</option>
<option value="'Oswald',sans-serif">Oswald</option>
<option value="'Bebas Neue',sans-serif">Bebas Neue</option>
<option value="'Anton',sans-serif">Anton</option>
<option value="'Playfair Display',serif">Playfair Display</option>
<option value="'Pacifico',cursive">Pacifico</option>
<option value="'Permanent Marker',cursive">Permanent Marker</option>
<option value="'Space Mono',monospace">Space Mono</option>
<option value="system-ui,sans-serif">Systémový</option>
</select></label>
<label><span>Hrúbka písma<output id="o_fw">700</output></span><input type="range" id="fw" min="100" max="900" step="100" value="700"></label>
<label><span>Veľkosť písma<output id="o_fz">8</output></span><input type="range" id="fz" min="2" max="30" value="8"></label>
<label><span>Rozostup písmen<output id="o_fl">4</output></span><input type="range" id="fl" min="-10" max="60" value="4"></label>
<label><span>Poloha zhora<output id="o_fy">85</output></span><input type="range" id="fy" min="5" max="95" value="85"></label>
<label>Farba textu<input type="color" id="fc" value="#ffffff" style="width:100%;height:40px"></label>
<div class="row">
<button class="main" id="go">Rozpadnúť</button>
<button id="back">Zložiť späť</button>
</div>
<div class="row"><button id="loop" aria-pressed="false">Slučka</button><button id="touch" aria-pressed="false">Rozpad prstom</button><button id="trec">Nahrať prst</button><button id="save" class="main">Uložiť slučku</button></div>
<p class="sub" id="msg" role="status"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const EN={
'Rozpad na pixely':'Pixel disintegration','Nahraj až 30 fotiek (napr. na mesačný recap), nastav efekt a ulož video.':'Upload up to 30 photos (e.g. for a monthly recap), set the effect and save a video.',
'Nahrať fotky':'Upload photos','Presety':'Presets','Formát':'Format','Smer rozpadu':'Direction','Tvar častíc':'Particle shape',
'Postup rozpadu':'Progress','Veľkosť pixelov':'Pixel size','Dosah':'Spread','Smer vetra':'Wind direction','Turbulencia':'Turbulence','Náhodnosť':'Randomness','Gravitácia':'Gravity','Žiara častíc':'Glow','Polomer prsta':'Finger radius','Dĺžka prechodu':'Transition length',
'Pozadie videa':'Video background','Text na prvej fotke':'Text on the first photo','Systémový':'System','Hrúbka písma':'Font weight','Veľkosť písma':'Font size','Rozostup písmen':'Letter spacing','Poloha zhora':'Position from top','Farba textu':'Text color',
'Rozpadnúť':'Disintegrate','Zložiť späť':'Reassemble','Slučka':'Loop','Rozpad prstom':'Finger mode','Nahrať prst':'Record finger','Uložiť slučku':'Save loop','Zastaviť a uložiť':'Stop and save','Pusti fotku sem':'Drop photos here',
'Vietor':'Wind','Od stredu':'From center','Vír':'Vortex','Pôvodný':'Original','Štvorec':'Square','Kruh':'Circle','Trojuholník':'Triangle','Čiarka':'Streak','Kód':'Code','Piesok':'Sand','Iskry':'Sparks',
'Ťahaj prstom po fotke.':'Drag your finger across the photo.','Ukladanie tu nie je dostupné.':'Saving is not available here.','Tento prehliadač nevie nahrávať video.':'This browser cannot record video.','Nahrávam jednu slučku…':'Recording one loop…','Uložené.':'Saved.','Zrušené.':'Cancelled.','Uloženie zlyhalo.':'Saving failed.','Nahrávam. Ťahaj prstom po fotke.':'Recording. Drag your finger across the photo.','Vyber obrázky (JPG, PNG alebo WebP).':'Choose images (JPG, PNG or WebP).','Obrázky sa nepodarilo načítať.':'Could not load the images.'
};
let lang='';
try{lang=localStorage.getItem('rzp-lang')||''}catch(e){}
if(lang!=='sk'&&lang!=='en'){const l=(navigator.language||'').slice(0,2);lang=(l==='sk'||l==='cs')?'sk':'en'}
const tr=s=>lang==='en'&&EN[s]?EN[s]:s;
const orig=new WeakMap();
function applyLang(){
 document.documentElement.lang=lang;document.title=tr('Rozpad na pixely');
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 let n;
 while((n=w.nextNode())){
  if(n.parentNode.id==='msg'||n.parentNode.tagName==='SCRIPT')continue;
  let k=orig.get(n);
  if(k===undefined){const v=n.nodeValue.trim();if(!EN[v])continue;k=v;orig.set(n,k)}
  n.nodeValue=tr(k);
 }
 $('ttl').placeholder=lang==='en'?'e.g. October 2026':'napr. Október 2026';
 $('lang').textContent=lang==='en'?'SK':'EN';
}
const cv=$('cv'),ctx=cv.getContext('2d');
let W=800,H=520,imgs=[],cur=0,cells=[],p=0,anim=null;
const defs=[
['p','Postup rozpadu',0,100,0,'%'],
['size','Veľkosť pixelov',3,40,8,'px'],
['spread','Dosah',5,100,55,'%'],
['angle','Smer vetra',0,360,0,'°'],
['turb','Turbulencia',0,100,35,'%'],
['rand','Náhodnosť',0,100,40,'%'],
['grav','Gravitácia',-100,100,0,'%'],
['glow','Žiara častíc',0,100,0,'%'],
['rad','Polomer prsta',3,40,12,'%'],
['dur','Dĺžka prechodu',.5,10,4,' s']
];
const ctl=$('ctl');
defs.forEach(([id,name,mn,mx,v,u])=>{
 const l=document.createElement('label');
 l.innerHTML=`<span>${name}<output id="o_${id}">${v}${u}</output></span><input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}" step="${id==='dur'?.5:1}">`;
 ctl.appendChild(l);
 l.querySelector('input').addEventListener('input',e=>{
  $('o_'+id).textContent=e.target.value+u;
  if(id==='size'){build();if(touchOn)touchInit()}
  else if(id==='p'){stop();p=e.target.value/100;draw()}
  else{draw();if(id==='dur')info()}
 });
});
function stop(){if(trec)return;if(anim){cancelAnimationFrame(anim);anim=null}looping=false;$('loop').setAttribute('aria-pressed',false);touchOn=false;$('touch').setAttribute('aria-pressed',false);cv.style.touchAction='auto'}
function setP(v){p=v;$('p').value=Math.round(v*100);$('o_p').textContent=Math.round(v*100)+'%'}
function run(to){
 stop();
 const from=p,dur=+$('dur').value*1000*Math.max(.15,Math.abs(to-from)),t0=performance.now();
 if(from===to)return;
 (function step(t){
  const k=Math.min(1,(t-t0)/dur);
  setP(from+(to-from)*k);draw();
  anim=k<1?requestAnimationFrame(step):null;
 })(t0);
}
$('go').onclick=()=>run(1);
$('back').onclick=()=>{if(p>=.999&&imgs.length>1)cur=(cur+1)%imgs.length;run(0)};
let files=[],gen=0;
const colr=(c,k)=>{let v=c.cs[k];if(!v){const d=imgs[k].d,i=c.i;v=c.cs[k]=`rgb(${d[i]},${d[i+1]},${d[i+2]})`}return v};
function info(sk){
 const n=imgs.length;
 msg((n>1?(lang==='en'?n+' photos, loop lasts about '+Math.round(cycleT(+$('dur').value))+' s.':n+' fotiek, slučka trvá asi '+Math.round(cycleT(+$('dur').value))+' s.'):'')+(sk?(lang==='en'?' Skipped: ':' Preskočené: ')+sk+'.':''));
}
let tcv=null;
function buildTxt(){
 const t=$('ttl').value.trim();
 if(!t||!W){tcv=null;return}
 const fam=$('fnt').value,wt=$('fw').value,fs=Math.max(8,Math.round(Math.min(W,H)*$('fz').value/100)),ls=$('fl').value*fs/100;
 const font=`${wt} ${fs}px ${fam}`,m=document.createElement('canvas').getContext('2d');
 m.font=font;
 const ch=[...t],ad=ch.map(x=>m.measureText(x).width);
 const tot=ad.reduce((a,b)=>a+b,0)+ls*(ch.length-1);
 const sc=Math.min(1,W*.92/Math.max(1,tot)),pad=Math.ceil(fs*.6),w=Math.ceil(tot*sc)+pad*2,h=Math.ceil(fs*1.6);
 const mk=(col,sh)=>{
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.font=font;g.textBaseline='middle';g.fillStyle=col;
  if(sh){g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=fs*.25}
  g.translate(pad,h/2);g.scale(sc,sc);
  let x=0;ch.forEach((k,i)=>{g.fillText(k,x,0);x+=ad[i]+ls});
  return c;
 };
 tcv={c:[mk($('fc').value,1),mk('#00e5ff'),mk('#ff2bd6')],w,h};
}
function refreshTxt(){
 const fam=$('fnt').value,wt=$('fw').value;
 const f=document.fonts&&document.fonts.load?document.fonts.load(`${wt} 40px ${fam}`,$('ttl').value||'A'):null;
 Promise.resolve(f).catch(()=>{}).then(()=>{buildTxt();draw()});
}
function ttl(){
 if(!tcv)return;
 const g=touchOn?tg:(cur===0?Math.min(1,p/.2):1);
 if(g>=1)return;
 const{c,w,h}=tcv,x=(W-w)/2,y=H*$('fy').value/100-h/2;
 if(g<=0){ctx.drawImage(c[0],x,y);return}
 const n=Math.max(6,Math.round(h/6)),sh=h/n;
 for(let i=0;i<n;i++){
  const r=Math.random(),sy=i*sh;
  if(r<g){
   if(r<g*.4){ctx.globalAlpha=.7;ctx.drawImage(c[1+(i&1)],0,sy,w,sh,x+(Math.random()-.5)*g*h*1.5,y+sy,w,sh);ctx.globalAlpha=1}
   continue;
  }
  ctx.drawImage(c[0],0,sy,w,sh,x+(Math.random()-.5)*g*h*.8,y+sy,w,sh);
 }
}
['ttl','fnt','fw','fz','fl','fy','fc'].forEach(id=>$(id).addEventListener('input',()=>{const o=$('o_'+id);if(o)o.textContent=$(id).value;refreshTxt()}));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refreshTxt);
async function getDl(){
 if(window.claude&&claude.use){try{return await claude.use('downloads')}catch(e){}}
 return{save:async({filename,data})=>{
  const u=URL.createObjectURL(data),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
 }};
}
async function decode(f){
 try{if(window.createImageBitmap)return await createImageBitmap(f)}catch(e){}
 return new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);r(i)};i.onerror=()=>{URL.revokeObjectURL(u);r(null)};i.src=u});
}
async function loadFiles(fl){
 const list=[...fl].filter(f=>f&&f.type&&f.type.startsWith('image/')).slice(0,30);
 if(!list.length){msg('Vyber obrázky (JPG, PNG alebo WebP).');return}
 files=list;
 const my=++gen,n=list.length,out=[];
 let w=0,h=0,sk=0;
 for(let k=0;k<n;k++){
  msg(lang==='en'?'Loading '+(k+1)+' / '+n+'…':'Nahrávam '+(k+1)+' / '+n+'…');
  const im=await decode(list[k]);
  if(my!==gen)return;
  if(!im){sk++;continue}
  if(!out.length){const ar=ratio||im.width/im.height,A=Math.min(2.1e6,3.6e7/n,im.width*im.height),ww=Math.sqrt(A*ar);w=Math.round(ww)&~1;h=Math.round(A/ww)&~1}
  const o=document.createElement('canvas');o.width=w;o.height=h;
  const oc=o.getContext('2d');oc.imageSmoothingQuality='high';
  const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;
  oc.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  out.push({o});
  if(im.close)im.close();
 }
 if(!out.length){msg('Obrázky sa nepodarilo načítať.');return}
 imgs=out;W=w;H=h;cv.width=W;cv.height=H;buildTxt();
 cur=0;stop();setP(0);build();info(sk);
}
function build(){
 const s=+$('size').value,gw=Math.ceil(W/s),gh=Math.ceil(H/s);cells=[];
 const gc=document.createElement('canvas');gc.width=gw;gc.height=gh;
 const gx=gc.getContext('2d',{willReadFrequently:true});gx.imageSmoothingQuality='high';
 imgs.forEach(m=>{gx.clearRect(0,0,gw,gh);gx.drawImage(m.o,0,0,gw,gh);m.d=gx.getImageData(0,0,gw,gh).data});
 for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){
  const cx=Math.min(W-1,x+(s>>1)),cy=Math.min(H-1,y+(s>>1)),i=((y/s)*gw+(x/s))*4;
  cells.push({x,y,nx:x/W-.5,ny:y/H-.5,cs:[],i,r:Math.random(),a:Math.random()-.5,b:Math.random()-.5});
 }
 draw();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(rec){ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,W,H)}
 if(touchOn&&base)ctx.drawImage(base,0,0);else{const im=imgs[cur];if(im)ctx.drawImage(im.o,0,0)}
 const s=+$('size').value,sp=$('spread').value/100*W,tu=$('turb').value/100,rd=$('rand').value/100,gr=$('grav').value/100*H,dm=dirm,gl=$('glow').value/100;
 const an=$('angle').value*Math.PI/180,dx=Math.cos(an),dy=Math.sin(an);
 for(const c of cells){
  let lead,vx=dx,vy=dy;
  if(dm==='w')lead=Math.min(1,Math.max(0,.5-(c.nx*dx+c.ny*dy)*.8));
  else{
   const l=Math.hypot(c.nx,c.ny)||.001;lead=Math.min(1,l*1.4);
   if(dm==='o'){vx=c.nx/l;vy=c.ny/l}else{vx=-c.ny/l*.9+c.nx/l*.35;vy=c.nx/l*.9+c.ny/l*.35}
  }
  c.vx=vx;c.vy=vy;
  const t=lead*(1-rd)*.9+c.r*rd*.9;
  const q=touchOn?(c.f||0):Math.min(1,Math.max(0,(p*1.15-t)/.25));
  c.q=q;
  if(q>0){if(rec){ctx.fillStyle=$('bg').value;ctx.fillRect(c.x,c.y,s,s)}else ctx.clearRect(c.x,c.y,s,s)}
 }
 for(const c of cells){
  const q=c.q;
  if(q===0||q===1)continue;
  const d=q*q*sp*(.4+c.r),w=c.a*tu*sp*q*1.2,dx=c.vx,dy=c.vy;
  ctx.globalAlpha=1-q;
  ctx.fillStyle=colr(c,touchOn?(c.ph|0):cur);
  const z=s*(1-q*.5);
  const X=c.x+dx*d-dy*w,Y=c.y+dy*d+dx*w+c.b*tu*sp*.3*q+gr*q*q*(.5+c.r);
  if(gl>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-q)*gl*.18;ctx.beginPath();ctx.arc(X+z/2,Y+z/2,z*1.6,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1-q}
  shape(X,Y,z,q,c,dx,dy);
 }
 ctx.globalAlpha=1;
 ttl();
}
let sh='sq',looping=false,rec=false,t0=0;
const HOLD=0,msg=t=>{$('msg').textContent=tr(t)};
const shr=$('shapes');
[['sq','Štvorec'],['ci','Kruh'],['tr','Trojuholník'],['ln','Čiarka'],['mx','Kód']].forEach(([k,n])=>{
 const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',k===sh);
 b.onclick=()=>{sh=k;[...shr.children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
 shr.appendChild(b);
});
const MXG='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789';
function shape(x,y,z,q,c,dx,dy){
 if(sh==='sq'){ctx.fillRect(x,y,z,z);return}
 if(sh==='mx'){
  const k=touchOn?(c.ph|0):cur;
  let col=(c.mg||(c.mg=[]))[k];
  if(!col){const m=colr(c,k).match(/\d+/g),l=(.3*m[0]+.59*m[1]+.11*m[2])|0;col=`rgb(${l>>3},${Math.min(255,l+70)},${l>>2})`;c.mg[k]=col}
  if(c.mi===undefined)c.mi=Math.random()*MXG.length|0;
  const a=ctx.globalAlpha;
  ctx.fillStyle=col;ctx.font=Math.max(7,z*1.4)+'px monospace';
  for(let i=0;i<3;i++){ctx.globalAlpha=a*(i?(i===1?.45:.2):1);ctx.fillText(MXG[(c.mi+(i?i*3:((q*18)|0)))%MXG.length],x,y+z-i*z*1.2)}
  ctx.globalAlpha=a;return;
 }
 const h=z/2,cx=x+h,cy=y+h;
 if(sh==='ln'){
  ctx.strokeStyle=colr(c,touchOn?(c.ph|0):cur);ctx.lineWidth=Math.max(1,z*.3);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-dx*z*(1+q*3),cy-dy*z*(1+q*3));ctx.stroke();return;
 }
 ctx.beginPath();
 if(sh==='ci')ctx.arc(cx,cy,h,0,6.283);
 else{const a=c.a*q*12;for(let i=0;i<3;i++){const t=a+i*2.094,X=cx+Math.cos(t)*z*.7,Y=cy+Math.sin(t)*z*.7;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath()}
 ctx.fill();
}
const cycleT=d=>(HOLD+2*d)*Math.max(1,imgs.length);
function cycleP(t,d){
 const N=Math.max(1,imgs.length),g=HOLD+2*d,T=g*N;t=((t%T)+T)%T;
 const k=Math.floor(t/g),u=t-k*g;
 if(u<HOLD){cur=k;return 0}
 if(u<HOLD+d){cur=k;return (u-HOLD)/d}
 cur=(k+1)%N;return 1-(u-HOLD-d)/d;
}
function tick(now){
 if(!looping)return;
 setP(cycleP((now-t0)/1000,+$('dur').value));draw();
 anim=requestAnimationFrame(tick);
}
$('loop').onclick=()=>{

$('save').onclick=async()=>{

 if(!t){msg('Tento prehliadač nevie nahrávať video.');return}
 stop();rec=true;msg('Nahrávam jednu slučku…');
 const bs=[...document.querySelectorAll('button')];bs.forEach(b=>b.disabled=true);
 const d=+$('dur').value,T=cycleT(d),ch=[];
 const mr=new MediaRecorder(cv.captureStream(30),{mimeType:t[0],videoBitsPerSecond:8e6});

 const done=new Promise(r=>{mr.onstop=r});
 mr.start();
 await new Promise(res=>{const s0=performance.now();(function f(now){const e=(now-s0)/1000;setP(cycleP(Math.min(e,T-.001),d));draw();e<T?requestAnimationFrame(f):res()})(s0)});
 setP(0);draw();mr.stop();await done;
 rec=false;draw();bs.forEach(b=>b.disabled=false);
 try{await dl.save({filename:'rozpad-slucka.'+t[1],data:new Blob(ch,{type:t[0].split(';')[0]})});msg('Uložené.')}
 catch(e){msg(e&&e.code==='declined'?'Zrušené.':'Uloženie zlyhalo.')}
};
let dirm='w',touchOn=false,pt=null,tl=0,ratio=0;

 const el=$(id);
 list.forEach(([k,n],i)=>{

const sv=(id,v)=>{const e=$(id);e.value=v;e.dispatchEvent(new Event('input'))};

const ppos=e=>{const r=cv.getBoundingClientRect();pt={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};lm=performance.now()};
cv.addEventListener('pointerdown',e=>{if(touchOn)ppos(e)});
cv.addEventListener('pointermove',e=>{if(touchOn)ppos(e)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{pt=null}));
function touchTick(now){
 if(!touchOn)return;
 const dt=Math.min(.05,(now-tl)/1000),R=$('rad').value/100*W;tl=now;
 const bx=base.getContext('2d'),sz=+$('size').value,ins=1/Math.max(.5,+$('dur').value*.4);
 if(pt&&now-lm<600){idleT=0;chk=false;tg=Math.min(1,tg+dt/.6)}else{idleT+=dt;if(idleT>.6&&!chk&&wipeCheck())chk=true}
 for(const c of cells){
  let f=c.f||0;
  const dd=pt?Math.hypot(c.x-pt.x,c.y-pt.y):1e9;
  const st=c.st|0;
  if(st===0){if(dd<R*(.6+.4*c.r))c.st=1}
  else if(st===1){f=Math.min(1,f+dt*2.5);if(f>=1){c.st=2;if(imgs.length>1){c.ph=((c.ph|0)+1)%imgs.length;lastPh=c.ph;bx.drawImage(imgs[c.ph].o,c.x,c.y,sz,sz,c.x,c.y,sz,sz)}}}
  else if(st===2){f=Math.max(0,f-dt*ins);if(f<=0)c.st=0}
  else{
   c.gt+=dt;
   if(c.gt>=c.gd){
    if(c.gt-c.gd>=c.gl){c.ph=gn;c.st=0;bx.drawImage(imgs[gn].o,c.x,c.y,sz,sz,c.x,c.y,sz,sz)}
    else if(Math.random()<.6){
     bx.drawImage(imgs[Math.random()<.5?gn:c.go].o,c.x+(Math.random()-.5)*sz*4,c.y+(Math.random()-.5)*sz,sz,sz,c.x,c.y,sz,sz);
     if(Math.random()<.35){bx.globalAlpha=.55;bx.fillStyle=Math.random()<.5?'#0ff':'#f0f';bx.fillRect(c.x,c.y+Math.random()*sz,sz,Math.max(1,sz*.2));bx.globalAlpha=1}
    }
   }
  }
  c.f=f;
 }
 draw();anim=requestAnimationFrame(touchTick);
}
$('touch').onclick=()=>{
 if(rec)return;
 const on=!touchOn;stop();
 if(on){touchOn=true;$('touch').setAttribute('aria-pressed',true);cv.style.touchAction='none';touchInit();tl=performance.now();anim=requestAnimationFrame(touchTick);msg('Ťahaj prstom po fotke.')}
 else{msg('');draw()}
};
let base=null,trec=false,tmr=null,tch=[],tdl=null,tt=null,lastPh=-1,lm=0,idleT=0,chk=false,gn=0,tg=0;
function wipeCheck(){
 const n=imgs.length;if(n<2||lastPh<0)return true;
 let hit=0;
 for(const c of cells){if(c.st|0)return false;if((c.ph|0)===lastPh)hit++}
 const tot=cells.length;
 if(hit===tot||hit<tot*.5)return true;
 gn=lastPh;
 for(const c of cells)if((c.ph|0)!==lastPh){c.st=3;c.gt=0;c.gd=(c.y/H)*.7+Math.random()*.3;c.gl=.3+Math.random()*.3;c.go=c.ph|0}
 return false;
}
function touchInit(){
 base=document.createElement('canvas');base.width=W;base.height=H;
 base.getContext('2d').drawImage(imgs[0].o,0,0);
 cells.forEach(c=>{c.f=0;c.ph=0;c.st=0});lastPh=-1;idleT=0;chk=false;tg=0;
}
const vtype=()=>[['video/mp4;codecs=avc1','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9','webm'],['video/webm','webm']].find(([m])=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
$('trec').onclick=async()=>{
 const bs=()=>[...document.querySelectorAll('button')];
 if(!trec){

  $('trec').textContent=tr('Zastaviť a uložiť');
  msg('Nahrávam. Ťahaj prstom po fotke.');
 }else{
  const done=new Promise(r=>{tmr.onstop=r});
  tmr.stop();await done;
  trec=false;rec=false;
  bs().forEach(b=>{b.disabled=false});
  $('trec').textContent=tr('Nahrať prst');
  try{await tdl.save({filename:'rozpad-prst.'+tt[1],data:new Blob(tch,{type:tt[0].split(';')[0]})});msg('Uložené.')}
  catch(e){msg(e&&e.code==='declined'?'Zrušené.':'Uloženie zlyhalo.')}
 }
};
